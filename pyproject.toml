[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cll-cpm-inversion"
version = "0.2.0"
description = "Invert segmented spheroid morphology into CPM parameter posteriors"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Djameldino" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.22",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-image>=0.20",
    "scikit-learn>=1.1",
    "pillow>=9.0",
    "tifffile>=2022.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.6",
    "jupyter>=1.0",
]

[project.scripts]
cll-invert = "cll_cpm_inversion.cli:main"

[project.urls]
Source = "https://github.com/DjamelZair/CPM-parameter-Posterior-Estimate-Generator"
Issues = "https://github.com/DjamelZair/CPM-parameter-Posterior-Estimate-Generator/issues"

[tool.setuptools.packages.find]
include = ["cll_cpm_inversion*"]

[tool.setuptools.package-data]
cll_cpm_inversion = ["data/*.csv", "data/*.csv.gz"]
